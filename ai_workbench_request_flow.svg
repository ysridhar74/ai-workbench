<svg width="680" height="1000" viewBox="0 0 680 1000" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="500" fill="#1F4E79">AI Workbench — End-to-End Request Flow</text>

  <!-- Step numbers column -->
  <!-- 1: User submits -->
  <text x="165" y="56" text-anchor="end" font-size="11" fill="#888780">1</text>
  <rect x="220" y="32" width="240" height="56" rx="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="56" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">User submits task</text>
  <text x="340" y="74" text-anchor="middle" font-size="12" fill="#185FA5">Web UI or Desktop app</text>
  <line x1="340" y1="88" x2="340" y2="118" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- 2: API Gateway -->
  <text x="165" y="150" text-anchor="end" font-size="11" fill="#888780">2</text>
  <rect x="200" y="120" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="144" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">API gateway</text>
  <text x="340" y="162" text-anchor="middle" font-size="12" fill="#0F6E56">Auth check · route to agent runner</text>
  <line x1="340" y1="176" x2="340" y2="206" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- 3: Agent Runner -->
  <text x="165" y="238" text-anchor="end" font-size="11" fill="#888780">3</text>
  <rect x="180" y="208" width="320" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="232" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Agent runner</text>
  <text x="340" y="250" text-anchor="middle" font-size="12" fill="#993C1D">Select skill · load tool manifest</text>

  <!-- Fork lines -->
  <line x1="340" y1="264" x2="340" y2="286" stroke="#888780" stroke-width="0.5"/>
  <line x1="160" y1="286" x2="520" y2="286" stroke="#888780" stroke-width="0.5"/>
  <line x1="160" y1="286" x2="160" y2="308" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="286" x2="520" y2="308" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- 4: RAG Engine -->
  <text x="58" y="340" text-anchor="end" font-size="11" fill="#888780">4a</text>
  <rect x="60" y="310" width="200" height="64" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="160" y="336" text-anchor="middle" font-size="14" font-weight="500" fill="#72243E">RAG engine</text>
  <text x="160" y="354" text-anchor="middle" font-size="12" fill="#993556">Vector search → top-k chunks</text>

  <!-- 4b: Memory Manager -->
  <text x="422" y="340" text-anchor="end" font-size="11" fill="#888780">4b</text>
  <rect x="422" y="310" width="200" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="522" y="336" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Memory manager</text>
  <text x="522" y="354" text-anchor="middle" font-size="12" fill="#5F5E5A">Session history · long-term facts</text>

  <!-- Merge lines -->
  <line x1="160" y1="374" x2="160" y2="400" stroke="#888780" stroke-width="0.5"/>
  <line x1="522" y1="374" x2="522" y2="400" stroke="#888780" stroke-width="0.5"/>
  <line x1="160" y1="400" x2="522" y2="400" stroke="#888780" stroke-width="0.5"/>
  <line x1="340" y1="400" x2="340" y2="418" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- 5: Context Assembly -->
  <text x="165" y="450" text-anchor="end" font-size="11" fill="#888780">5</text>
  <rect x="180" y="420" width="320" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="444" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">Context assembly</text>
  <text x="340" y="462" text-anchor="middle" font-size="12" fill="#854F0B">Prompt + RAG chunks + memory + tools</text>
  <line x1="340" y1="476" x2="340" y2="506" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- 6: LiteLLM -->
  <text x="165" y="538" text-anchor="end" font-size="11" fill="#888780">6</text>
  <rect x="180" y="508" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="532" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">LiteLLM → LLM provider</text>
  <text x="340" y="550" text-anchor="middle" font-size="12" fill="#534AB7">Claude · GPT-4 · Ollama · …</text>
  <line x1="340" y1="564" x2="340" y2="594" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- 7: Decision -->
  <text x="165" y="622" text-anchor="end" font-size="11" fill="#888780">7</text>
  <rect x="220" y="596" width="240" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="622" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Tool call needed?</text>

  <!-- YES branch -->
  <text x="502" y="616" font-size="11" fill="#888780">Yes</text>
  <line x1="460" y1="618" x2="540" y2="618" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <rect x="540" y="592" width="110" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="595" y="614" text-anchor="middle" font-size="14" font-weight="500" fill="#27500A">MCP tool</text>
  <text x="595" y="632" text-anchor="middle" font-size="12" fill="#3B6D11">Execute</text>

  <!-- Loop back arrow (tool result) -->
  <path d="M650 618 L662 618 L662 536 L500 536" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="650" y="578" text-anchor="end" font-size="11" fill="#888780">Tool result</text>

  <!-- NO branch -->
  <text x="208" y="636" text-anchor="end" font-size="11" fill="#888780">No</text>
  <line x1="220" y1="640" x2="220" y2="668" stroke="#888780" stroke-width="0.5"/>
  <line x1="220" y1="668" x2="340" y2="668" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="640" x2="340" y2="668" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- 8: Memory Update -->
  <text x="165" y="700" text-anchor="end" font-size="11" fill="#888780">8</text>
  <rect x="180" y="670" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="694" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Memory update</text>
  <text x="340" y="712" text-anchor="middle" font-size="12" fill="#5F5E5A">Save turn · extract long-term facts</text>
  <line x1="340" y1="726" x2="340" y2="756" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- 9: Stream response -->
  <text x="165" y="788" text-anchor="end" font-size="11" fill="#888780">9</text>
  <rect x="200" y="758" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="782" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Stream response</text>
  <text x="340" y="800" text-anchor="middle" font-size="12" fill="#0F6E56">WebSocket · chunked tokens</text>
  <line x1="340" y1="814" x2="340" y2="844" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- 10: User sees result -->
  <text x="165" y="876" text-anchor="end" font-size="11" fill="#888780">10</text>
  <rect x="220" y="848" width="240" height="56" rx="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="872" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">User sees result</text>
  <text x="340" y="890" text-anchor="middle" font-size="12" fill="#185FA5">Web UI or Desktop app</text>

  <!-- Footer note -->
  <text x="340" y="960" text-anchor="middle" font-size="11" fill="#888780" font-style="italic">Dashed arrow = tool-use loop (repeats until no further tool calls needed)</text>
</svg>
