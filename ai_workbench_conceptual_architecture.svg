<svg width="680" height="860" viewBox="0 0 680 860" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:Arial,sans-serif;">
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="860" fill="#ffffff"/>

  <!-- Title -->
  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="500" fill="#1F4E79">AI Workbench — Conceptual Architecture</text>

  <!-- Layer labels -->
  <text x="40" y="48" font-size="11" fill="#888780" font-style="italic">Client layer</text>
  <line x1="40" y1="52" x2="640" y2="52" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Web Client -->
  <rect x="60" y="62" width="240" height="68" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="180" y="90" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">Web app</text>
  <text x="180" y="108" text-anchor="middle" font-size="12" fill="#185FA5">React SPA · REST / WebSocket</text>

  <!-- Desktop Client -->
  <rect x="380" y="62" width="240" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="500" y="90" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Desktop app</text>
  <text x="500" y="108" text-anchor="middle" font-size="12" fill="#534AB7">Electron + React · local IPC</text>

  <!-- Connector lines from clients -->
  <line x1="180" y1="130" x2="180" y2="160" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="130" x2="500" y2="160" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="150" x2="500" y2="150" stroke="#888780" stroke-width="0.5"/>
  <line x1="340" y1="150" x2="340" y2="168" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- API Gateway label -->
  <text x="40" y="186" font-size="11" fill="#888780" font-style="italic">API gateway</text>
  <line x1="40" y1="190" x2="640" y2="190" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- FastAPI -->
  <rect x="160" y="200" width="360" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="228" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">FastAPI server</text>
  <text x="340" y="246" text-anchor="middle" font-size="12" fill="#0F6E56">Auth · REST endpoints · WebSocket streaming · rate limiting</text>

  <!-- Arrow to orchestration -->
  <line x1="340" y1="268" x2="340" y2="302" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- Orchestration label -->
  <text x="40" y="320" font-size="11" fill="#888780" font-style="italic">Orchestration engine</text>
  <line x1="40" y1="324" x2="640" y2="324" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Orchestration container -->
  <rect x="44" y="334" width="592" height="210" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- Agent Runner -->
  <rect x="64" y="354" width="168" height="72" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="148" y="382" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Agent runner</text>
  <text x="148" y="400" text-anchor="middle" font-size="12" fill="#993C1D">ReAct · plan-execute</text>

  <!-- Skill Registry -->
  <rect x="256" y="354" width="168" height="72" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="382" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">Skill registry</text>
  <text x="340" y="400" text-anchor="middle" font-size="12" fill="#854F0B">Load · discover · run</text>

  <!-- MCP Registry -->
  <rect x="448" y="354" width="168" height="72" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="532" y="382" text-anchor="middle" font-size="14" font-weight="500" fill="#27500A">MCP registry</text>
  <text x="532" y="400" text-anchor="middle" font-size="12" fill="#3B6D11">Tool catalog · dispatch</text>

  <!-- RAG Engine -->
  <rect x="160" y="446" width="168" height="72" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="244" y="474" text-anchor="middle" font-size="14" font-weight="500" fill="#72243E">RAG engine</text>
  <text x="244" y="492" text-anchor="middle" font-size="12" fill="#993556">Ingest · chunk · retrieve</text>

  <!-- Memory Manager -->
  <rect x="352" y="446" width="168" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="436" y="474" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Memory manager</text>
  <text x="436" y="492" text-anchor="middle" font-size="12" fill="#5F5E5A">Short · long · entity</text>

  <!-- Internal arrows -->
  <line x1="232" y1="390" x2="256" y2="390" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="424" y1="390" x2="448" y2="390" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="244" y1="426" x2="244" y2="446" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="436" y1="426" x2="436" y2="446" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- Arrow to data layer -->
  <line x1="340" y1="544" x2="340" y2="578" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- Data layer label -->
  <text x="40" y="596" font-size="11" fill="#888780" font-style="italic">Data layer</text>
  <line x1="40" y1="600" x2="640" y2="600" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- MongoDB -->
  <rect x="60" y="610" width="180" height="68" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="150" y="638" text-anchor="middle" font-size="14" font-weight="500" fill="#27500A">MongoDB</text>
  <text x="150" y="656" text-anchor="middle" font-size="12" fill="#3B6D11">Skills · memory · RAG</text>

  <!-- Redis -->
  <rect x="260" y="610" width="180" height="68" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="350" y="638" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Redis (optional)</text>
  <text x="350" y="656" text-anchor="middle" font-size="12" fill="#993C1D">Task queue · cache</text>

  <!-- File system -->
  <rect x="460" y="610" width="180" height="68" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="550" y="638" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">File system</text>
  <text x="550" y="656" text-anchor="middle" font-size="12" fill="#5F5E5A">Local docs · uploads</text>

  <!-- Arrows to data stores -->
  <line x1="280" y1="544" x2="150" y2="610" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="544" x2="350" y2="610" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="544" x2="550" y2="610" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- Arrow to integration layer -->
  <line x1="340" y1="678" x2="340" y2="712" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- Integration label -->
  <text x="40" y="730" font-size="11" fill="#888780" font-style="italic">Integration layer</text>
  <line x1="40" y1="734" x2="640" y2="734" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- LiteLLM -->
  <rect x="60" y="744" width="180" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="150" y="772" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">LiteLLM</text>
  <text x="150" y="790" text-anchor="middle" font-size="12" fill="#534AB7">Claude · GPT · Ollama…</text>

  <!-- MCP Servers -->
  <rect x="260" y="744" width="180" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="350" y="772" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">MCP servers</text>
  <text x="350" y="790" text-anchor="middle" font-size="12" fill="#0F6E56">Files · web · DB · APIs</text>

  <!-- OS APIs -->
  <rect x="460" y="744" width="180" height="68" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="550" y="772" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">OS / desktop APIs</text>
  <text x="550" y="790" text-anchor="middle" font-size="12" fill="#854F0B">Notifications · tray · shell</text>
</svg>
